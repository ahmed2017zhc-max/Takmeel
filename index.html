<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>التكميل - السلامة الميدانية بالمنطقة المركزية</title>
  <style>
    :root {
      --navy-bg: #051b32;
      --navy-card: #092442;
      --navy-input: #041527;
      --navy-border: rgba(244, 246, 240, 0.22);
      --ivory: #f4f6f0;
      --ivory-soft: rgba(244, 246, 240, 0.78);
      --ivory-muted: rgba(244, 246, 240, 0.55);
      --accent-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      background-color: var(--navy-bg);
      color: var(--ivory);
      min-height: 100vh;
      padding: 16px;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      background: var(--navy-card);
      border: 1px solid var(--navy-border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .emblem-box {
      width: 112px;
      height: 112px;
      border-radius: 14px;
      overflow: hidden;
      background: var(--navy-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .emblem-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent-white);
    }

    .header p {
      font-size: 0.92rem;
      color: var(--ivory-soft);
    }

    .card {
      background: var(--navy-card);
      border: 1px solid var(--navy-border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent-white);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--navy-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    label {
      display: block;
      font-size: 0.86rem;
      color: var(--ivory-soft);
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--navy-input);
      color: var(--ivory);
      border: 1px solid var(--navy-border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-white);
    }

    textarea {
      min-height: 82px;
      resize: vertical;
    }

    .roster-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
    }

    .member-row {
      background: var(--navy-input);
      border: 1px solid var(--navy-border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .member-check {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      flex: 1;
    }

    .member-check input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-white);
      cursor: pointer;
    }

    .status-select {
      width: auto;
      padding: 5px 8px;
      font-size: 0.8rem;
      border-radius: 8px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      background: var(--ivory);
      color: var(--navy-bg);
      border: 1px solid var(--ivory);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    button.secondary {
      background: transparent;
      color: var(--ivory);
      border: 1px solid var(--navy-border);
    }

    .output-box {
      background: var(--navy-input);
      border: 1px solid var(--navy-border);
      border-radius: 12px;
      padding: 14px;
      white-space: pre-wrap;
      font-size: 0.92rem;
      color: var(--ivory);
      min-height: 150px;
    }

    .log-item {
      background: var(--navy-input);
      border: 1px solid var(--navy-border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .log-meta {
      font-size: 0.8rem;
      color: var(--ivory-muted);
      margin-bottom: 6px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ivory);
      color: var(--navy-bg);
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.88rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="emblem-box">
        <!-- استبدل src برابط أو مسار صورة الشعار المعتمد بدون إطار -->
        <img id="emblemImg" src="c3613d4b.jpeg" alt="شعار الدفاع المدني بدون إطار" />
      </div>
      <div>
        <h1>التكميل - السلامة الميدانية بالمنطقة المركزية</h1>
        <p>متابعة القوة الميدانية، إضافات التكميل، وتوليد التقرير اليومي</p>
      </div>
    </header>

    <section class="card">
      <div class="card-title">
        <span>بيانات التكميل الأساسية</span>
        <span id="presentCount" style="font-size:0.88rem; color:var(--ivory-soft);">الحضور: 0 / 11</span>
      </div>
      <div class="grid-2">
        <div>
          <label for="shiftDate">التاريخ</label>
          <input type="date" id="shiftDate" />
        </div>
        <div>
          <label for="shiftPeriod">الفترة / الوردية</label>
          <select id="shiftPeriod">
            <option value="الصباحية">الصباحية</option>
            <option value="المسائية">المسائية</option>
            <option value="الليلية">الليلية</option>
          </select>
        </div>
        <div>
          <label for="sectorName">القطاع / الموقع</label>
          <input type="text" id="sectorName" value="المنطقة المركزية" />
        </div>
        <div>
          <label for="supervisorName">المباشر / المسؤول</label>
          <input type="text" id="supervisorName" placeholder="اسم المسؤول الميداني" />
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-title">
        <span>إضافات التكميل والمستجدات الميدانية</span>
      </div>
      <div class="grid-2">
        <div>
          <label for="extraType">نوع الإضافة</label>
          <select id="extraType">
            <option value="ملاحظة سلامة ميدانية">ملاحظة سلامة ميدانية</option>
            <option value="بلاغ / متابعة منشأة">بلاغ / متابعة منشأة</option>
            <option value="تعزيز / تكليف إضافي">تعزيز / تكليف إضافي</option>
            <option value="تحديث معدات / جاهزية">تحديث معدات / جاهزية</option>
          </select>
        </div>
        <div>
          <label for="extraLocation">الموقع / المنشأة المرتبطة بالإضافة</label>
          <input type="text" id="extraLocation" placeholder="مثال: فندق / سوق / شارع..." />
        </div>
      </div>
      <div style="margin-top:12px;">
        <label for="extraNotes">تفاصيل الإضافة على التكميل</label>
        <textarea id="extraNotes" placeholder="اكتب أي إضافة أو مستجد أو ملاحظة ميدانية تود إلحاقها بنص التكميل..."></textarea>
      </div>
    </section>

    <section class="card">
      <div class="card-title">
        <span>قوة السلامة الميدانية (11 فرداً)</span>
        <button type="button" class="secondary" onclick="toggleAll(true)" style="padding:5px 10px; font-size:0.8rem;">تحديد الكل</button>
      </div>
      <div class="roster-list" id="rosterList"></div>
    </section>

    <section class="card">
      <div class="card-title"><span>نص التكميل الجاهز</span></div>
      <div class="output-box" id="reportOutput"></div>
      <div class="actions">
        <button type="button" onclick="generateReport()">تحديث التكميل</button>
        <button type="button" onclick="copyReport()">نسخ النص</button>
        <button type="button" class="secondary" onclick="saveLog()">حفظ في السجل</button>
      </div>
    </section>

    <section class="card">
      <div class="card-title">
        <span>السجل المحفوظ</span>
        <button type="button" class="secondary" onclick="clearLogs()" style="padding:5px 10px; font-size:0.8rem;">مسح السجل</button>
      </div>
      <div id="logsContainer"></div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const defaultMembers = [
      "الفرد 1", "الفرد 2", "الفرد 3", "الفرد 4",
      "الفرد 5", "الفرد 6", "الفرد 7", "الفرد 8",
      "الفرد 9", "الفرد 10", "الفرد 11"
    ];

    const STORAGE_KEY = "takmeel_central_logs_v2";

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2200);
    }

    function initDate() {
      const dateInput = document.getElementById("shiftDate");
      if (!dateInput.value) {
        dateInput.value = new Date().toISOString().split("T")[0];
      }
    }

    function renderRoster() {
      const container = document.getElementById("rosterList");
      container.innerHTML = "";
      defaultMembers.forEach((name, idx) => {
        const row = document.createElement("div");
        row.className = "member-row";
        row.innerHTML = `
          <label class="member-check">
            <input type="checkbox" class="member-cb" data-index="${idx}" checked onchange="updateCountsAndReport()" />
            <input type="text" class="member-name" value="${name}" oninput="generateReport()" style="padding:5px 8px; font-size:0.86rem;" />
          </label>
          <select class="status-select member-status" onchange="updateCountsAndReport()">
            <option value="على رأس العمل">على رأس العمل</option>
            <option value="ميداني">ميداني</option>
            <option value="مهمة">مهمة</option>
            <option value="إجازة">إجازة</option>
          </select>
        `;
        container.appendChild(row);
      });
      updateCountsAndReport();
    }

    function toggleAll(checked) {
      document.querySelectorAll(".member-cb").forEach(cb => {
        cb.checked = checked;
      });
      updateCountsAndReport();
    }

    function updateCountsAndReport() {
      const cbs = [...document.querySelectorAll(".member-cb")];
      const present = cbs.filter(cb => cb.checked).length;
      document.getElementById("presentCount").textContent = `الحضور: ${present} / ${cbs.length}`;
      generateReport();
    }

    function generateReport() {
      const date = document.getElementById("shiftDate").value || "-";
      const period = document.getElementById("shiftPeriod").value;
      const sector = document.getElementById("sectorName").value.trim() || "المنطقة المركزية";
      const supervisor = document.getElementById("supervisorName").value.trim();

      const extraType = document.getElementById("extraType").value;
      const extraLocation = document.getElementById("extraLocation").value.trim();
      const extraNotes = document.getElementById("extraNotes").value.trim();

      const rows = [...document.querySelectorAll(".member-row")];
      const presentMembers = [];
      const absentMembers = [];

      rows.forEach(r => {
        const checked = r.querySelector(".member-cb").checked;
        const name = r.querySelector(".member-name").value.trim() || "فرد";
        const status = r.querySelector(".member-status").value;
        if (checked) {
          presentMembers.push(`${name} (${status})`);
        } else {
          absentMembers.push(`${name} (${status})`);
        }
      });

      let text = `تكميل السلامة الميدانية - ${sector}\n`;
      text += `التاريخ: ${date} | الفترة: ${period}\n`;
      if (supervisor) text += `المسؤول: ${supervisor}\n`;
      text += `إجمالي القوة: ${rows.length} | الحضور: ${presentMembers.length} | الغياب/غير متواجد: ${absentMembers.length}\n`;

      if (presentMembers.length) {
        text += `\nالحضور:\n- ${presentMembers.join("\n- ")}`;
      }
      if (absentMembers.length) {
        text += `\n\nغير متواجدين:\n- ${absentMembers.join("\n- ")}`;
      }

      if (extraLocation || extraNotes) {
        text += `\n\nإضافات التكميل (${extraType}):`;
        if (extraLocation) text += `\n- الموقع/المنشأة: ${extraLocation}`;
        if (extraNotes) text += `\n- التفاصيل: ${extraNotes}`;
      }

      document.getElementById("reportOutput").textContent = text;
    }

    function copyReport() {
      const text = document.getElementById("reportOutput").textContent;
      navigator.clipboard.writeText(text).then(() => {
        showToast("تم نسخ نص التكميل");
      });
    }

    function saveLog() {
      const text = document.getElementById("reportOutput").textContent;
      const logs = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      logs.unshift({
        id: Date.now(),
        savedAt: new Date().toLocaleString("ar-SA"),
        content: text
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
      renderLogs();
      showToast("تم حفظ التكميل في السجل");
    }

    function renderLogs() {
      const container = document.getElementById("logsContainer");
      const logs = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (!logs.length) {
        container.innerHTML = `<p style="color:var(--ivory-muted); font-size:0.9rem;">لا توجد سجلات محفوظة حالياً.</p>`;
        return;
      }
      container.innerHTML = logs.map(item => `
        <div class="log-item">
          <div class="log-meta">محفوظ بتاريخ: ${item.savedAt}</div>
          <div style="white-space:pre-wrap; font-size:0.88rem;">${item.content}</div>
        </div>
      `).join("");
    }

    function clearLogs() {
      localStorage.removeItem(STORAGE_KEY);
      renderLogs();
      showToast("تم مسح السجل");
    }

    ["shiftDate", "shiftPeriod", "sectorName", "supervisorName", "extraType", "extraLocation", "extraNotes"]
      .forEach(id => {
        document.getElementById(id).addEventListener("input", generateReport);
        document.getElementById(id).addEventListener("change", generateReport);
      });

    initDate();
    renderRoster();
    renderLogs();
  </script>
</body>
</html>
